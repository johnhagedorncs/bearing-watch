[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearingwatch"
version = "0.1.0"
description = "Run-to-failure bearing anomaly detection: ingest, features, train on a healthy window, score, detect, serve, monitor."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Hagedorn" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "torch>=2.0",
]

[project.optional-dependencies]
# Optional integrations. Every one of these is behind a guarded import; the
# core pipeline runs green without any of them installed.
tracking = ["mlflow>=2.9"]
monitor = ["evidently>=0.7"]
s3 = ["boto3>=1.34"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
bearingwatch = "bearingwatch.cli:main"

[project.urls]
Homepage = "https://github.com/johnhagedorncs/bearing-watch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bearingwatch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests that take more than a couple of seconds",
  "optional: marks tests that require an optional dependency",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is the documented pattern
  "RUF012", # mutable class attrs without ClassVar

  # The package declares requires-python >=3.10, but the source deliberately
  # avoids constructs that ONLY work on 3.10+ so it can still be imported and
  # exercised on an older interpreter. These three rules push toward exactly
  # those constructs:
  "B905",   # zip(strict=) is 3.10+
  "RUF007", # itertools.pairwise is 3.10+

  # int(round(x)) is not redundant here. round() returns an int for a Python
  # float but returns a NUMPY SCALAR for a numpy input, and several of these
  # values are used as list indices or slice bounds where a np.float64 is not
  # acceptable. Removing the cast would work until the first caller passed an
  # array element.
  "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Pydantic resolves annotations at RUNTIME to build validators, and `X | None`
# cannot be evaluated on Python 3.9 even with `from __future__ import
# annotations`. This module must keep the typing.Optional / typing.Union
# spelling; the file says so at the top.
"src/bearingwatch/serve/schemas.py" = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.12"
files = ["src/bearingwatch"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
