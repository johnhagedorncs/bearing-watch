name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check src tests scripts

      - name: ruff (format check)
        run: ruff format --check src tests scripts

      - name: mypy
        run: mypy

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tracking,monitor,s3]"

      - name: pytest with coverage
        run: |
          pytest --cov=bearingwatch --cov-report=term-missing --cov-report=xml -q

      - name: upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pipeline:
    name: end-to-end on synthetic data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The whole pipeline, on data generated in this job. No downloads, so CI
      # cannot go red because an external dataset host is having a bad day.
      - name: generate synthetic data
        run: |
          python scripts/make_synthetic_data.py \
            --out data/raw/synthetic --n-snapshots 160 --healthy-fraction 0.40

      - name: preflight
        run: bearingwatch preflight --data data/raw/synthetic --set data.min_files=50

      - name: train
        run: |
          bearingwatch train \
            --data data/raw/synthetic --model pca \
            --set tracking.enabled=false

      # --fail-if-quiet turns "the detector never fired" into a red build. A
      # pipeline that runs to completion while detecting nothing is the failure
      # mode worth catching in CI, and it exits zero by default.
      - name: infer
        run: |
          bearingwatch infer \
            --data data/raw/synthetic \
            --truth-degradation-index 64 \
            --fail-if-quiet

      - name: model comparison
        run: |
          bearingwatch compare \
            --data data/raw/synthetic \
            --truth-degradation-index 64 \
            --out comparison.json

      - name: drift demonstration
        run: python scripts/drift_demo.py --data data/raw/synthetic --out drift_demo.json

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            comparison.json
            drift_demo.json
            runs/
          retention-days: 7

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: bearing-watch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must not run as root. Checked rather than assumed: the
      # Dockerfile could grow a later stage that resets USER and nothing else
      # would notice.
      - name: assert the container does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id bearing-watch:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: assert dev dependencies are absent from the runtime image
        run: |
          for pkg in pytest ruff mypy; do
            if docker run --rm --entrypoint python bearing-watch:ci -c "import $pkg" 2>/dev/null; then
              echo "$pkg is present in the runtime image"; exit 1
            fi
          done
          echo "no dev dependencies in the runtime image"

      - name: assert the CLI is installed
        run: docker run --rm --entrypoint bearingwatch bearing-watch:ci --help

      # Smoke test with NO model mounted. The correct behaviour is: the process
      # comes up, /health is 200, and /ready is false. A container that exits
      # when its model is missing gives the orchestrator a crash loop and gives
      # the operator no diagnostic.
      - name: smoke test the service
        run: |
          docker run -d --name bw -p 8000:8000 bearing-watch:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- /health ---"
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

          echo "--- /ready (expected: ready=false, no model mounted) ---"
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:8000/ready | grep -q '"ready":false'

          echo "--- container logs ---"
          docker logs bw
          docker rm -f bw

  manifests:
    name: deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: manifest structure tests
        run: pytest tests/test_deploy_manifests.py -q

      - name: install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: build every overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "=== $overlay ==="
            kustomize build --enable-alpha-plugins "$overlay" > /dev/null
          done

      # The base must remain suspended and the overlays must enable it. This is
      # asserted against the RENDERED output, not the source, because a patch
      # that silently fails to apply leaves the source looking correct.
      - name: assert the base cron ships suspended
        run: |
          kustomize build deploy/k8s/base | python -c "
          import sys, yaml
          crons = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get('kind') == 'CronWorkflow']
          assert crons, 'no CronWorkflow rendered from the base'
          for c in crons:
              assert c['spec']['suspend'] is True, 'base CronWorkflow is NOT suspended'
          print('base CronWorkflow is suspended')
          "

      - name: assert the overlays enable the schedule
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            kustomize build --enable-alpha-plugins "$overlay" | python -c "
          import sys, yaml
          crons = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get('kind') == 'CronWorkflow']
          assert crons, 'no CronWorkflow rendered'
          for c in crons:
              assert c['spec']['suspend'] is False, 'overlay did not enable the schedule'
          print('overlay enables the schedule')
          "
          done
