# Component that ACTIVATES the scheduled scoring workflow.
#
# The base ships the CronWorkflow suspended. An environment that wants it
# running includes this component, which is one line in that environment's
# kustomization and shows up in a diff as "this environment now runs a
# schedule". That is the property worth having: enabling a recurring job is a
# visible, reviewable, per-environment act rather than a default that arrives
# with the base.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: CronWorkflow
      name: bearing-watch-score-nightly
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false
