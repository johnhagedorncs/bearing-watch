apiVersion: apps/v1
kind: Deployment
metadata:
  name: bearing-watch-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bearing-watch
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bearing-watch
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: bearing-watch
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: bearing-watch:0.1.0
          ports:
            - name: http
              containerPort: 8000
          env:
            # An EXPLICIT run id, not "the latest". Resolving the newest run at
            # pod start means a rolling restart can silently change which model
            # is serving, and the two replicas can disagree mid-rollout.
            - name: BEARINGWATCH_RUN_DIR
              value: "/runs/PIN-ME-TO-A-RUN-ID"
            - name: BEARINGWATCH_RUNS_ROOT
              value: "/runs"
          # Liveness checks only that the process responds. It deliberately does
          # NOT check the model: restarting a pod does not conjure a missing run
          # folder, it just turns a diagnosable problem into a crash loop.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness gates traffic. A pod whose model failed to load stays up
          # and out of the load balancer, so it can be inspected.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runs
              mountPath: /runs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: bearing-watch-runs
        # readOnlyRootFilesystem is on, so anything needing scratch space gets
        # an explicit emptyDir rather than a writable root.
        - name: tmp
          emptyDir: {}
